<!DOCTYPE html>
<html lang="enn">
    <head>
        <title>OSCAR Sleep Share</title>
        <link rel="icon" type="image/png" href="static/images/oscar-logo.png" />
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">


        <link rel="stylesheet" href="static/css/site.css">
    </head>
    <html>
        <body class="light-background oldbg-forest">
            <div class="page-header">
                <img src="static/images/oscar-logo.png" height="30">
                <span style="font-weight: 600; font-size: 1.5rem; margin-left: 10px; flex-grow: 1">OSCAR</span>
                <div>
                    <div class="dropdown" >
                        <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="color:white">
                          <i class="fa fa-cog"></i>
                        </button>
                        <ul class="dropdown-menu">
                          <li><a class="dropdown-item" href="javascript:setDateFormat(`MM/DD/YYYY`)">mm/dd/yyyy</a></li>
                          <li><a class="dropdown-item" href="javascript:setDateFormat(`DD/MM/YYYY`)">dd/mm/yyyy</a></li>
                          <li><a class="dropdown-item" href="javascript:setDateFormat(`YYYY/MM/DD`)">yyyy/mm/dd</a></li>
                          <li><hr class="dropdown-divider"></li>
                          <li><a class="dropdown-item" href="javascript:setTimeFormat(`HH:mm:ss`)">24-hour</a></li>
                          <li><a class="dropdown-item" href="javascript:setTimeFormat(`hh:mm:ss A`)">AM/PM</a></li>
                        </ul>
                      </div>
                </div>
            </div>
            <div class="flex-row">

                <div class="flexbox" id="pnlMachineSettings" style="background-color: rgb(13, 182, 240); color: white;">
                    <div style="display: flex; column-gap: 10px; margin-bottom:8px;">
                        <b><i class="fa fa-sliders fa-solid" style="font-size: 1.5em"></i></b>
                        <b style="flex-grow: 1">Machine Settings</b>
                        <div style="text-align: right;"><span id="txtMachineBrand"></span> <span id="txtMachineModel"></span></div>
                    </div>

                    <table class="tbl table-striped-light" style="font-size: 0.85rem">
                        <tbody id="tblMachineSettings">
                            <tr>
                                <td>Pressure</td>
                                <td>12 cmH20</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                
                <div class="flexbox" id="pnlSessions" style="background-color: #6fa54e; color:white">
                    <div style="display: flex; column-gap: 10px; margin-bottom:8px;">
                        <b><i class="fa fa-list-check fa-solid" style="font-size: 1.5em"></i></b>
                        <b style="flex-grow: 1">Sessions</b>
                    </div>
                    <table class="tbl table-striped-light" style="font-size: 0.85rem">
                        <thead>
                            <tr>
                                <th></th>
                                <th>Start</th>
                                <th>End</th>
                                <th>Duration</th>
                            </tr>
                        </thead>
                        <tbody id="tblSessions">

                        </tbody>
                    </table>
                </div>

                <div class="flexbox" style="background-color: #5b4d85; color:white" id="pnlStats">
                    <div style="display: flex; column-gap: 10px; margin-bottom:8px;" >
                        <b><i class="fa fa-chart-simple fa-solid" style="font-size: 1.5em"></i></b>
                        <b style="flex-grow: 1">Statistics</b>
                    </div>
                    <table class="tbl table-striped-light" style="font-size: 0.85rem">
                        <thead>
                            <tr>
                                <th></th>
                                <th>Min</th>
                                <th>Med</th>
                                <th>95%</th>
                                <th>99.5%</th>
                                <th>Max</th>
                                <th>Units</th>
                            </tr>
                        </thead>
                        <tbody id="tblStats">

                        </tbody>
                    </table>

                    <div style="display:flex; position: relative; align-items: flex-start;">
                        <div id="pnlAHI"><div id="lblAHI"><b>AHI</b><div id="lblAHIValue" style="font-size: 1.15rem">1.25</div></div></div>
                        <div id="chtAHI"></div>   

                        <table class="tbl table-striped-light" style="font-size: 0.85rem; margin-top: 25px;">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th>%</th>
                                    <th>Time</th>                                    
                                </tr>
                            </thead>
                            <tbody id="tblRespiratoryEvents">

                            </tbody>
                        </table>                     
                    </div>
                </div>

            </div>

            <div class="flex-row">
                <div class="flexbox">
                    <div id="pnlTimeline">                                                
                    </div>
                    <div id="pnlGraphs"></div>
                </div>
            </div>

            <div id="pnlLoading">
                <div style="color:white; font-size: 3.5rem" id="pnlLoadingText"></div>
            </div>

            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.min.js"></script>
            <script src="https://cdn.canvasjs.com/ga/canvasjs.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment-with-locales.min.js" integrity="sha512-4F1cxYdMiAW98oomSLaygEwmCnIP38pb4Kx70yQYqRwLVCs3DbRumfBq82T08g/4LJ/smbFGFpmeFlQgoDccgg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            <script src="https://code.createjs.com/1.0.0/easeljs.min.js"></script>
            <script src="static/js/oscar/main.js"></script>

            <script>
                $(async () => {
                    var locale = window.navigator.userLanguage || window.navigator.language;
                    moment.locale(locale);
                    restoreSettings();
                    await loadData("https://riaancillie.blob.core.windows.net/test/data.json.gz");
                });
            </script>

        </body>
    </html>
</html>
