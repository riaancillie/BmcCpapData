<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BMC Data Vizualizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        .chartRow{
            width: 98%;
            display:grid;
            grid-template-columns: 20px auto;
        }

        .rowHandle{
            width: 20px;
            background: #aaa solid;

        }

        .rowHandle i.btnPan {
            margin-left:10px;
            margin-top:8px;
            color: #999;
            cursor:move

        }

        .rowHandle i.btnDelete {
            margin-left:10px;
            margin-top:25px;
            color: #999;


        }

        .divSetting{
            display: flex;
            min-width: 200px;                        
            column-gap: 8px;
            padding: 5px;
        }

        .divKey{
            width: 170px;
            font-weight: bold;
        }

        /*.divSetting:nth-of-type(odd){background-color: #ddd;}*/

    </style>
  </head>
  <body>
    <h1 id="txtHeader">BMC Data - Loading data...</h1>

    <div id="pnlCharts" style="width: 100%;">

    </div>

    <div id="divCursor" style="width: 1px; height: 100vh; background-color: slategrey; position:fixed; top: 0px; left: -10px; z-index:-1"></div>
    <br><br>
    <h4>Machine Settings</h4>
    <div id="divMachineSettings" style="width: 100%; margin: 10px; flex-wrap: wrap; display: grid; grid-template-columns: auto auto auto auto auto;">        
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@^2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@^1"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js" integrity="sha512-csIng5zcB+XpulRUa+ev1zKo7zRNGpEaVfNB9On1no9KYTEY/rLGAEEpvgdw6nim1WdTuihZY1eqZ31K7/fZjw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>



    <script>

        var charts =  [];
        var data = [];

        let colorsEvents = {"HYP": "#BFD970", "OSA": "#BB6D84", "CSA": "#F08764"}
        let colors = ["#e3adee", "#f66283", "#5fc0c1", "#f79e34", "#9767ff", "#facc4a"];
        let colorIndex = 0;

        Array.prototype.max = function() {        return Math.max.apply(null, this);        };
        Array.prototype.min = function() {        return Math.min.apply(null, this);        };
        Array.prototype.avg = function() {        return this.reduce((a,b) => a+b) / this.length;        };
        let remap = function(x, oldLow, oldHigh, newLow, newHigh) {      return newLow + (newHigh-newLow) * (x - oldLow) / (oldHigh - oldLow)};



        async function getData(url){
            let response = await fetch(`../sdcard_data/${url}.json`);
            let json = await response.json();
            data = json.Packets;
            //console.log(data);            

            let mapBundledData = (data, keyName, yValFunc) => {
                let result = [];
                for (let packet of data){
                    let startTime = moment(packet.Timestamp);
                    let period = 1000 / packet[keyName].length;
                    for (let val of packet[keyName]){
                        result.push({x: startTime, y: yValFunc ? yValFunc(val) : val});
                        startTime += period;
                    }
                }
                return result;
            };

            createMachineSettingsTable(json);
            

            await createEventChart(json);

            await createChart(data.map(itm => {return {x:  moment(itm.Timestamp).valueOf(), y: itm.IPAP}}), "IPAP [1Hz]", "cmH20", 0);
            await createChart(data.map(itm => {return {x:  moment(itm.Timestamp).valueOf(), y: itm.EPAP}}), "EPAP [1Hz]", "cmH20", 0);

            await createChart(mapBundledData(data, "Flow", y => y), "Flow", "LPM");

            await createChart(data.map(itm => {return {x:  moment(itm.Timestamp).valueOf(), y: itm.TidalVolume % 65535 }}), "Tidal Volume", "ml", 0);

            await createChart(data.map(itm => {return {x:  moment(itm.Timestamp).valueOf(), y: itm.RespirationRate % 65535 }}), "Respiration Rate", "BPM", 0);
            
            
            await createChart(mapBundledData(data, "Unknown1"), "Pressure Wave", "No Unit");
            
            await createChart(mapBundledData(data, "Unknown2", y => y % 65535), "Snoring", "No Unit");

            await createChart(data.map(itm => {return {x:  moment(itm.Timestamp).valueOf(), y: itm.Unknown4Ints[9] / 10.0}}), "Leak", "LPM");

            await createChart(data.map(itm => {return {x:  moment(itm.Timestamp).valueOf(), y: (itm.Unknown5Ints[1] % 65535) / 10}}), "Minute Ventilation", "L");


            ieRatioLookup = [0, 9.1, 16.7, 23.1, 28.6, 33.3, 37.5, 41.2, 44.4, 47.4, 50, 52.4, 54.5, 56.5, 58.3, 
                60, 61.5, 63, 64.3, 65.5, 66.7, 67.7, 68.8, 69.7, 70.6, 71.4, 72.2, 73, 73.7, 74.4, 75, 75.6, 76.2, 
                76.7, 77.3, 77.8, 78.3, 78.7, 79.2, 79.6, 80, 80.4, 80.8, 81.1, 81.5, 81.8, 82.1, 82.5, 82.8, 83.1, 
                83.3, 83.6, 83.9, 84.1, 84.4, 84.6, 84.8, 85.1, 85.3, 85.5, 85.7, 85.9, 86.1, 86.3, 86.5, 86.7, 
                86.8, 87, 87.2, 87.3, 87.5, 87.7, 87.8, 88, 88.1, 88.2, 88.4, 88.5, 88.6, 88.8, 88.9, 89, 89.1, 89.2, 
                89.4, 89.5, 89.6, 89.7, 89.8, 89.9, 90, 90.1, 90.2, 90.3, 90.4, 90.5, 90.6, 90.7, 90.7, 90.8];

            //let mapIeRatio = (rawValue) => { return (100 * rawValue) / (rawValue + 10) };
            let mapIeRatio = (rawValue) => { return rawValue >= 0 && rawValue <= 100 ? ieRatioLookup[rawValue] : 0 };

            ieSeries = [
                {
                    name: "Insp",
                    data: data.map(itm => {return {x:  moment(itm.Timestamp).valueOf(), y: mapIeRatio(itm.Unknown6Ints[0])}}) 
                },                
            ];

            ieSeries.push({
                name: "Exp",
                data: ieSeries[0].data.map(itm => {return {x: itm.x, y: 100-itm.y }})
            });  
            
            await createChart(ieSeries, "I/E Ratio", "%", null, true, true);

            //await createChart(data.map(itm => {return {x:  moment(itm.Timestamp).valueOf(), y: mapIeRatio(itm.Unknown6Ints[0])}}), "I/E Ratio", "%");

            $("#txtHeader").text("BMC Data - "+json.Name);
        }

        function createMachineSettingsTable(json){
            if (json.MachineSettings == null) return;

            for (let key of Object.keys(json.MachineSettings)){
                let elm = $(`<div class="divSetting"><div class="divKey">${key}</div><div  class="divValue">${json.MachineSettings[key]}</div><div>`);
                $("#divMachineSettings").append(elm);
            }
        }

        
        async function createEventChart(data){
            let datasetHYP = [];
            let datasetCSA = [];
            let datasetOSA = [];

            let endTime = moment(data.Packets[data.Packets.length-1].Timestamp).valueOf();

            datasetHYP.push({x: moment(data.Packets[0].Timestamp).valueOf(), y: 0});
            for (let event of data.Events.HYP ?? []){
                datasetHYP.push({x: moment(event.StartTimestamp).valueOf(), y: 1});
                datasetHYP.push({x: moment(event.StartTimestamp).valueOf() + (event.Duration * 1000), y: 1});
                datasetHYP.push({x: moment(event.StartTimestamp).valueOf() + (event.Duration * 1000)+1, y: 0});
            }
            datasetHYP.push({x: endTime, y: 0});

            datasetCSA.push({x: moment(data.Packets[0].Timestamp).valueOf(), y: 0});
            for (let event of data.Events.CSA ?? []){
                datasetCSA.push({x: moment(event.StartTimestamp).valueOf(), y: 1});
                datasetCSA.push({x: moment(event.StartTimestamp).valueOf() + (event.Duration * 1000), y: 1});
                datasetCSA.push({x: moment(event.StartTimestamp).valueOf() + (event.Duration * 1000)+1, y: 0});
            }
            datasetCSA.push({x: endTime, y: 0});

            datasetOSA.push({x: moment(data.Packets[0].Timestamp).valueOf(), y: 0});
            for (let event of data.Events.OSA ?? []){
                datasetOSA.push({x: moment(event.StartTimestamp).valueOf(), y: 1});
                datasetOSA.push({x: moment(event.StartTimestamp).valueOf() + (event.Duration * 1000), y: 1});
                datasetOSA.push({x: moment(event.StartTimestamp).valueOf() + (event.Duration * 1000)+1, y: 0});
            }
            datasetHYP.push({x: endTime, y: 0});



            let newDom = $(`<div class="chartRow"><div class="rowHandle"> <i class="fa-solid fa-up-down-left-right"></i></div><canvas style="width: 100%; height: 150px"></canvas></div>`);
            $("#pnlCharts").append(newDom);

            let onChartZoom = (sender) => {
                var xMinVal = sender.chart.scales.x.options.min;
                var xMaxVal = sender.chart.scales.x.options.max;
                for (let chart of charts){
                    if (chart == sender.chart) continue;
                    chart.scales.x.options.min = xMinVal;
                    chart.scales.x.options.max = xMaxVal;
                    chart.update();
                }
            };

            let chart = new Chart(
                $("canvas", newDom)[0],
                {
                type: 'line',
                data: {
                    datasets: [
                    {
                        label: "HYP",
                        stepped: true,
                        data: datasetHYP,
                        borderWidth: 1,
                        fill: true,
                        radius: 0,
                        lineTension: 0,
                        backgroundColor: colorsEvents.HYP,
                        borderColor: colorsEvents.HYP
                    },
                    {
                        label: "CSA",
                        stepped: true,
                        data: datasetCSA,
                        borderWidth: 1,
                        fill: true,
                        radius: 0,
                        lineTension: 0,
                        backgroundColor: colorsEvents.CSA,
                        borderColor: colorsEvents.CSA
                    },
                    {
                        label: "OSA",
                        stepped: true,
                        data: datasetOSA,
                        borderWidth: 1,
                        fill: true,
                        radius: 0,
                        lineTension: 0,
                        backgroundColor: colorsEvents.OSA,
                        borderColor: colorsEvents.OSA
                    }
                    ]
                },
                options: {
                    parsing: false,
                    animation: false,
                    interaction:{
                        mode: "nearest",
                        axis: "x",
                        intersect: false
                    },
                    scales: {
                        x: {
                            type: "time",
                            ticks: {source: "auto", maxRotation: 0, autoSkip: true},
                            time: {displayFormats: {minute: "HH:mm:ss", hour: "HH:mm:ss", second: "HH:mm:ss"}},
                            display: charts.length == 0,
                            position: "top"
                        },
                        y: {
                            title: {text :"Event", display: true},
                            suggestedMin: 0,                            
                        }
                    },
                    plugins: {
                        decimation: { enabled: true, algorithm:  "lttb",  samples: 4000, threshold: 4000},
                        legend: { align: "start", title: {align: "start" }, labels: {font: {weight: "bold", size: 14}, boxWidth: 15} },
                        zoom: {zoom: {wheel: {enabled: true}, mode: "x", onZoom: onChartZoom}, pan: {enabled: true, mode: "x", onPan: onChartZoom}}
                    },

                }
                }
            );

            charts.push(chart);
        }

        function delay(ms){return new Promise(res => {setTimeout(() => {res()}, ms)})}

        async function createChart(chartData, name, unitText, suggestedMin, multipleDatasets, stacked){
            await delay(1);
            console.log(`BMC Data - Creating chart for ${name}`)
            $("#txtHeader").text(`BMC Data - Creating chart for ${name}`);

            let newDom = $(`<div class="chartRow"><div class="rowHandle"><i class="fa-solid fa-up-down-left-right btnPan"></i> <i class="fa fa-trash btnDelete" aria-hidden="true"></i></div><canvas style="width: 100%; height: 150px"></canvas></div>`);
            $("#pnlCharts").append(newDom);

            let onChartZoom = (sender) => {
                var xMinVal = sender.chart.scales.x.options.min;
                var xMaxVal = sender.chart.scales.x.options.max;
                for (let chart of charts){
                    if (chart == sender.chart) continue;
                    chart.scales.x.options.min = xMinVal;
                    chart.scales.x.options.max = xMaxVal;
                    chart.update();
                }
            };

            let datasets = [];
            if (multipleDatasets){
                for (let series of chartData){
                    datasets.push({
                        label: series.name,
                        data: series.data,
                        borderWidth: 1,
                        radius: 0,
                        lineTension: 0,
                        backgroundColor: colors[colorIndex % colors.length],
                        borderColor: colors[colorIndex++ % colors.length],
                        fill: stacked ?? False,
                    })
                }
            }else{
                datasets = [{
                    label: name,
                    data: chartData,
                    borderWidth: 1,
                    radius: 0,
                    lineTension: 0,
                    backgroundColor: colors[colorIndex % colors.length],
                    borderColor: colors[colorIndex++ % colors.length]                    
                }]
            }

            let chart = new Chart(
                $("canvas", newDom)[0],
                {
                type: 'line',
                data: {
                    datasets: datasets
                },
                options: {
                    parsing: false,
                    animation: false,
                    spanGaps: 60 * 1000,
                    interaction:{
                        mode: "nearest",
                        axis: "x",
                        intersect: false
                    },
                    scales: {
                        x: {
                            type: "time",
                            ticks: {source: "auto", maxRotation: 0, autoSkip: true},
                            time: {displayFormats: {minute: "HH:mm:ss"}},
                            display: charts.length == 0,
                            position: "top"
                        },
                        y: {
                            title: {text :unitText, display: true},
                            suggestedMin: suggestedMin,
                            stacked: stacked ?? false,
                        }
                    },
                    plugins: {
                        decimation: { enabled: true, algorithm:  "lttb", samples: 4000, threshold: 4000},
                        legend: { align: "start", title: {align: "start" }, labels: {font: {weight: "bold", size: 14}, boxWidth: 15} },
                        zoom: {zoom: {wheel: {enabled: true}, mode: "x", onZoom: onChartZoom}, pan: {enabled: true, mode: "x", onPan: onChartZoom}}
                    },

                }
                }
            );

            charts.push(chart);

            $(".btnDelete", newDom).click(() => {
                $(newDom).remove();
                let idx = charts.indexOf(chart);
                charts.splice(idx,1);
            });
        }


        async function main(){
            const params = new Proxy(new URLSearchParams(window.location.search), {
                get: (searchParams, prop) => searchParams.get(prop),
            });
            getData(params.file);

            $("body").on("mousemove", () => {
                $("#divCursor").css("left", event.clientX + "px");
            });

            new Sortable($("#pnlCharts")[0], {
                animation: 150,
                handle: ".rowHandle i"
            });

            swal.fire({
                title: "Instructions",
                html: "Charts can be panned by dragging, zoomed by using the mouse wheel, re-arranged using the handle or deleted if not needed or zooming and panning is too slow. Refresh to bring them back",
                timer: 15000,
                timerProgressBar: true,
            });
        }

        main();
    </script>
  </body>
</html>
